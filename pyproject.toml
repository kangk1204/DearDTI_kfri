[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "deardti-kfri"
version = "1.0.0"
description = "DearDTI-derived molecular graph and protein sequence regression for measured Kd"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.5", "rdkit>=2024.3", "joblib>=1.3", "requests>=2.31"]

[project.optional-dependencies]
neural = ["torch==2.11.0"]
test = ["pytest>=8"]

[project.scripts]
deardti-kfri = "nutriomics_dti.native_kd_runner:main"
deardti-kfri-infer = "nutriomics_dti.portable_inference:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nutriomics_dti = ["vendor/DEARDTI_MIT_LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
